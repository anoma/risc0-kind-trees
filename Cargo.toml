[workspace]
resolver = "3"
members = ["crates/kind-trees", "crates/integration-test"]

[workspace.package]
version = "1.0.0-rc.8"
keywords = ["anoma", "kind-tree", "protocol-adapter"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/risc0-kind-trees"
homepage = "https://anoma.net/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.5.0", features = ["full"] }
alloy-chains = "0.2.39"
anoma-generic-call-forwarder-bindings = "2.0.0-rc.8"
# The circuit crates are pinned exactly: another build has another logic ref, and so another kind.
anoma-generic-call-library = "=2.0.0-rc.4"
anoma-pa-evm-bindings = { git = "https://github.com/anoma/pa-evm", tag = "bindings/v3.0.0-rc.20" }
anoma-pa-solana-client = "0.12.1"
anoma-pa-testkit = "1.0.0-rc.6"
anoma-rm-risc0 = { version = "2.0.0-rc.8.1", default-features = false, features = [
  "transaction",
] }
anomapay-erc20-forwarder-bindings = "3.0.0-rc.19"
anomapay-spl-token-forwarder-client = "0.11.1"
anomapay_erc20_library = "=2.0.0-rc.4"
anomapay_erc20_witness = "=2.0.0-rc.4"
anyhow = "1.0.104"
bs58 = "0.5.1"
dotenvy = "0.15.7"
hex = "0.4.3"
k256 = { version = "0.13.3", features = ["arithmetic", "hash2curve"] }
risc0-zkvm = { version = "3.0.6", default-features = false }
rstest = "0.28.0"
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

# The e2e test crates of the protocol adapter and the ERC20 forwarder, pinned by git tag, because they are not on crates.io.
anoma-pa-evm-integration-test = { git = "https://github.com/anoma/pa-evm", tag = "bindings/v3.0.0-rc.20" }
anomapay-erc20-forwarder-integration-test = { git = "https://github.com/anoma/anomapay-erc20-forwarder", tag = "bindings/v3.0.0-rc.19" }

# The AnomaPay Solana resource's witness crate, pinned by git tag: it is not published (`transfer_witness` on crates.io is
# the ERC20 resource's).
anomapay-solana-transfer-witness = { package = "transfer_witness", git = "https://github.com/anoma/anomapay-solana-resource", tag = "v2.0.0-rc.12" }
solana-cluster-type = "3.2.1"
solana-program-pack = "3"
solana-pubkey = "3"
solana-rpc-client = "4"
spl-token-interface = "3"

anoma-risc0-kind-trees = { path = "crates/kind-trees" }
