[package]
name = "anoma-risc0-kind-trees-integration-test"
version.workspace = true
description = "Integration tests for the Anoma kind trees: on-chain token identity, forwarder records, root freshness and soft migration."
publish = false
keywords.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true

[features]
# Compiles the e2e tests, which fork a chain and prove through the queue.
e2e = []

[dependencies]
alloy = { workspace = true }
alloy-chains = { workspace = true }
anoma-pa-evm-bindings = { workspace = true }
anoma-risc0-kind-trees = { workspace = true, features = ["arm"] }
anyhow = { workspace = true }
solana-program-pack = { workspace = true }
solana-pubkey = { workspace = true }
solana-rpc-client = { workspace = true }
spl-token-interface = { workspace = true }

[dev-dependencies]
anoma-generic-call-forwarder-bindings = { workspace = true }
anoma-pa-evm-integration-test = { workspace = true, features = ["e2e"] }
anoma-pa-solana-client = { workspace = true, features = ["rpc"] }
anoma-pa-testkit = { workspace = true, features = ["fixtures"] }
anoma-rm-risc0 = { workspace = true }
anomapay-erc20-forwarder-bindings = { workspace = true }
anomapay-erc20-forwarder-integration-test = { workspace = true }
anomapay-solana-transfer-witness = { workspace = true }
anomapay-spl-token-forwarder-client = { workspace = true, features = ["rpc"] }
anomapay_erc20_witness = { workspace = true }
risc0-zkvm = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
